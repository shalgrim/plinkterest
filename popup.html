<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 15px 0;
      color: #e60023;
    }

    .info {
      margin-bottom: 15px;
      padding: 10px;
      background-color: #f5f5f5;
      border-radius: 5px;
    }

    .pin-count {
      font-weight: bold;
      color: #e60023;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #e60023;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #ad081b;
    }

    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }

    .warning {
      font-size: 12px;
      color: #666;
      margin-top: 10px;
      text-align: center;
    }

    .error {
      color: #d00;
      padding: 10px;
      background-color: #fee;
      border-radius: 5px;
      margin-bottom: 10px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>Pinterest Link Opener</h1>

  <div id="error" class="error" style="display: none;"></div>

  <div class="info">
    <div>Pins found: <span id="pinCount" class="pin-count">Loading...</span></div>
  </div>

  <button id="openButton">Open All Pins</button>

  <div class="warning">
    Opens each pin in a new tab
  </div>

  <script src="popup.js"></script>
</body>
</html>
